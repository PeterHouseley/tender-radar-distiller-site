<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="scorebookTitle scorebookDesc">
  <title id="scorebookTitle">Tender evaluation scorebook</title>
  <desc id="scorebookDesc">An official procurement-style evaluator scorebook showing buyer weighting, supplier evidence, pass marks and a no-bid trigger before writing begins.</desc>
  <defs><filter id="shadow" x="-16%" y="-16%" width="132%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#2b2118" flood-opacity=".24"/></filter><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0v46" fill="none" stroke="#2b2118" stroke-opacity=".055"/></pattern></defs>
  <rect width="1180" height="720" rx="28" fill="#efe6d2"/><rect width="1180" height="720" rx="28" fill="url(#grid)"/>
  <g filter="url(#shadow)"><rect x="54" y="46" width="1072" height="628" rx="14" fill="#fbf6ea" stroke="#2b2118" stroke-opacity=".26"/></g>
  <g font-family="Courier New, monospace" font-weight="900" letter-spacing="3"><text x="86" y="96" font-size="18" fill="#6f2718">EVALUATION SCOREBOOK / WEIGHTING CHECK</text><text x="908" y="96" font-size="15" fill="#8e2a21">BID-WEEK GATE</text></g>
  <text x="86" y="150" font-family="Georgia,serif" font-size="54" font-weight="900" letter-spacing="-2" fill="#221d17">Can we score before we write?</text>
  <g transform="translate(86 198)" font-family="Aptos, Segoe UI, sans-serif" fill="#221d17"><rect width="1008" height="58" fill="#221d17"/><g fill="#fbf6ea" font-family="Courier New, monospace" font-size="15" font-weight="900"><text x="22" y="37">BUYER CRITERIA</text><text x="338" y="37">WEIGHT</text><text x="486" y="37">OUR EVIDENCE</text><text x="806" y="37">ACTION</text></g><g font-size="18" font-weight="850"><g transform="translate(0 78)"><rect width="1008" height="66" fill="#f4ead8" stroke="#cdbb9d"/><rect width="10" height="66" fill="#29563d"/><text x="24" y="42">Relevant public-sector delivery</text><text x="348" y="42" font-family="Georgia,serif" font-size="28" font-weight="900">35%</text><text x="486" y="42">2 case studies match buyer context</text><text x="806" y="42" fill="#29563d" font-family="Courier New,monospace" font-weight="900">SCOREABLE</text></g><g transform="translate(0 160)"><rect width="1008" height="66" fill="#fbf6ea" stroke="#cdbb9d"/><rect width="10" height="66" fill="#a96e1f"/><text x="24" y="42">Social value commitments</text><text x="348" y="42" font-family="Georgia,serif" font-size="28" font-weight="900">20%</text><text x="486" y="42">local angle exists; proof thin</text><text x="806" y="42" fill="#a96e1f" font-family="Courier New,monospace" font-weight="900">CLARIFY</text></g><g transform="translate(0 242)"><rect width="1008" height="66" fill="#f4ead8" stroke="#cdbb9d"/><rect width="10" height="66" fill="#8e2a21"/><text x="24" y="42">Accreditation / policy evidence</text><text x="348" y="42" font-family="Georgia,serif" font-size="28" font-weight="900">25%</text><text x="486" y="42">mandatory ISO wording not met</text><text x="806" y="42" fill="#8e2a21" font-family="Courier New,monospace" font-weight="900">NO-BID</text></g><g transform="translate(0 324)"><rect width="1008" height="66" fill="#fbf6ea" stroke="#cdbb9d"/><rect width="10" height="66" fill="#29563d"/><text x="24" y="42">Price and delivery confidence</text><text x="348" y="42" font-family="Georgia,serif" font-size="28" font-weight="900">20%</text><text x="486" y="42">capacity and timeline plausible</text><text x="806" y="42" fill="#29563d" font-family="Courier New,monospace" font-weight="900">MODEL</text></g></g></g>
  <g transform="translate(832 568) rotate(-7)" font-family="Courier New,monospace" font-weight="900" text-anchor="middle"><circle cx="100" cy="46" r="54" fill="none" stroke="#8e2a21" stroke-width="5"/><text x="100" y="40" font-size="15" fill="#8e2a21">KILL IF</text><text x="100" y="64" font-size="18" fill="#8e2a21">UNSCOREABLE</text></g>
  <text x="86" y="632" font-family="Courier New,monospace" font-size="16" font-weight="900" letter-spacing="2" fill="#6e6254">THE RADAR NOW TESTS BUYER WEIGHTINGS BEFORE A SUPPLIER COMMITS TO A BID WEEK.</text>
</svg>
