<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Tender policy proof locker</title>
  <desc id="desc">A procurement dossier proof locker showing insurance, accreditations, policies, case studies and social value evidence checked before a tender is pursued.</desc>
  <defs><filter id="lockerShadow" x="-16%" y="-16%" width="132%" height="144%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#2b2118" flood-opacity="0.24"/></filter><pattern id="lockerGrid" width="46" height="42" patternUnits="userSpaceOnUse"><path d="M0 42H46M46 0V42" fill="none" stroke="#2b2118" stroke-opacity="0.06"/></pattern></defs>
  <rect width="1180" height="720" rx="26" fill="#efe6d2"/><rect width="1180" height="720" rx="26" fill="url(#lockerGrid)"/><rect x="54" y="46" width="1072" height="628" rx="14" fill="#fbf6ea" stroke="#2b2118" stroke-opacity="0.28" filter="url(#lockerShadow)"/>
  <text x="86" y="96" font-family="Courier New, monospace" font-size="18" font-weight="900" letter-spacing="4" fill="#6f2718">POLICY PROOF LOCKER / BID-ROOM READINESS</text><text x="86" y="150" font-family="Georgia, serif" font-size="54" font-weight="900" letter-spacing="-2" fill="#221d17">Proof checked before pursuit.</text>
  <g transform="translate(86 202)" font-family="Aptos, Segoe UI, sans-serif" fill="#221d17"><rect width="656" height="364" fill="#f4ead8" stroke="#cdbb9d"/><rect width="656" height="58" fill="#221d17"/><g fill="#fbf6ea" font-family="Courier New, monospace" font-size="15" font-weight="900"><text x="24" y="37">LOCKER ITEM</text><text x="352" y="37">STATUS</text><text x="510" y="37">CALL</text></g><g font-size="18" font-weight="850"><g transform="translate(0 82)"><rect width="656" height="56" fill="#fbf6ea"/><rect width="10" height="56" fill="#29563d"/><text x="24" y="36">Professional indemnity / insurance</text><text x="352" y="36">limit fits</text><text x="510" y="36" font-family="Courier New, monospace" font-size="14" font-weight="900" fill="#29563d">READY</text></g><g transform="translate(0 148)"><rect width="656" height="56" fill="#f4ead8"/><rect width="10" height="56" fill="#a96e1f"/><text x="24" y="36">Cyber and data policies</text><text x="352" y="36">expiry date gap</text><text x="510" y="36" font-family="Courier New, monospace" font-size="14" font-weight="900" fill="#a96e1f">QUERY</text></g><g transform="translate(0 214)"><rect width="656" height="56" fill="#fbf6ea"/><rect width="10" height="56" fill="#29563d"/><text x="24" y="36">Two relevant case studies</text><text x="352" y="36">one rewrite needed</text><text x="510" y="36" font-family="Courier New, monospace" font-size="14" font-weight="900" fill="#29563d">USE</text></g><g transform="translate(0 280)"><rect width="656" height="56" fill="#f4ead8"/><rect width="10" height="56" fill="#8e2a21"/><text x="24" y="36">Mandatory accreditation</text><text x="352" y="36">not evidenced</text><text x="510" y="36" font-family="Courier New, monospace" font-size="14" font-weight="900" fill="#8e2a21">NO-BID</text></g></g></g>
  <g transform="translate(802 196)" filter="url(#lockerShadow)" font-family="Aptos, Segoe UI, sans-serif"><rect width="276" height="392" rx="6" fill="#2b241c"/><rect x="18" y="18" width="240" height="356" fill="none" stroke="#efe6d2" stroke-opacity="0.24"/><text x="36" y="62" font-family="Courier New, monospace" font-size="14" font-weight="900" letter-spacing="2" fill="#ddb36b">DECISION SLIP</text><text x="36" y="136" font-family="Georgia, serif" font-size="58" font-weight="900" fill="#fbf6ea">PARK</text><text x="36" y="180" font-size="18" font-weight="850" fill="#eadcc7">Policy expiry dates missing. Ask before bid-starter work.</text><rect x="36" y="226" width="176" height="36" fill="#a96e1f"/><text x="52" y="249" font-family="Courier New, monospace" font-size="13" font-weight="900" fill="#fff">48H EVIDENCE CHECK</text><path d="M36 302H224M36 336H184" stroke="#efe6d2" stroke-opacity="0.34" stroke-width="8"/></g>
  <g transform="translate(828 574) rotate(-8)" font-family="Courier New, monospace" font-weight="900" text-anchor="middle"><circle cx="92" cy="50" r="52" fill="none" stroke="#29563d" stroke-width="5"/><text x="92" y="43" fill="#29563d" font-size="14">PROOF</text><text x="92" y="68" fill="#29563d" font-size="19">LOCKED</text></g><text x="86" y="632" font-family="Courier New, monospace" font-size="16" font-weight="900" letter-spacing="2" fill="#6e6254">SHORTLIST → POLICY LOCKER → QUERY, PURSUE OR NO-BID BEFORE THE SUPPLIER WRITES.</text>
</svg>